<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>房间</title>
<link rel="stylesheet" href="common.css">
<style>
  .notice {
    margin: 12px 16px;
    padding: 10px 0;
    background: var(--bg-2);
    border-radius: 10px;
    font-size: 12px;
    color: var(--text-2);
    display: flex; align-items: center; gap: 6px;
  }
  .notice .ico { font-size: 14px; }

  .members-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--divider);
  }
  .members-bar .m-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .members-bar .m-item .avatar { position: relative; }
  .members-bar .m-item .avatar.invite {
    background: transparent; border: 2px dashed #c9d6f0;
    color: var(--primary); font-size: 22px; font-weight: 300;
  }
  /* 房主角标：头像右下角小三角徽章 */
  .members-bar .m-item.owner .avatar::after {
    content: '';
    position: absolute;
    right: -2px; bottom: -2px;
    width: 14px; height: 14px;
    background: var(--primary);
    border: 2px solid #fff;
    border-radius: 50%;
    background-image: radial-gradient(circle at 50% 50%, transparent 3px, var(--primary) 3px);
  }
  .members-bar .m-item .name {
    font-size: 11px; color: var(--text-2);
    max-width: 56px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .members-bar .m-item .avatar.sm { cursor: pointer; }

  .tap-hint {
    margin: 0 16px 12px;
    font-size: 11px;
    color: var(--text-3);
    line-height: 1.4;
    display: flex; align-items: center; gap: 4px;
    min-height: 32px;
  }
  .tap-hint .ico { color: var(--primary); }

  .messages {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: var(--bg-2);
  }
  .msg-row { display: flex; gap: 8px; align-items: center; }
  .msg-row.self { flex-direction: row-reverse; }

  .msg.system {
    align-self: center;
    background: rgba(0,0,0,0.04);
    color: var(--text-3);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 10px;
  }
  .msg.system.warn { background: var(--lose-soft); color: var(--lose-text); }
  .msg.system.pay {
    background: var(--bg);
    color: var(--text-2);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 10px;
    align-self: center;
  }
  .msg.system.pay .arrow { color: var(--text-4); margin: 0 4px; }
  .msg.system.pay .amount { color: var(--primary); font-weight: 600; }

  .msg .bubble {
    background: var(--bg);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    max-width: 240px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.05);
  }
  /* self 气泡内部需要左右 padding 让文字不贴边缘 */
  .msg-row .bubble { /* default */ }
  .msg.system.pay .arrow { color: var(--text-4); margin: 0 4px; }
  .msg.system.pay .amount { color: var(--primary); font-weight: 600; }
  .msg-row.self .bubble {
    background: var(--primary);
    color: #fff;
  }

  .actions-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--divider);
    padding: 12px 16px;
    display: flex; gap: 12px;
  }
  .actions-bar .btn { flex: 1; }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="icons">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span>📶</span>
        <span class="battery"><i></i></span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="back">‹</div>
      <div class="title">房间 mucj</div>
      <div class="action">⋯</div>
    </div>

    <div class="screen">
      <div class="notice">
        <span class="ico">ⓘ</span>
        <span>本平台不涉及赌博和金钱，具体请查看使用手册</span>
      </div>

      <div class="members-bar">
        <div class="m-item owner">
          <div class="avatar">法</div>
          <div class="name">法外狂徒</div>
        </div>
        <div class="m-item">
          <div class="avatar win-bg">张</div>
          <div class="name">张三</div>
        </div>
        <div class="m-item">
          <div class="avatar lose-bg">李</div>
          <div class="name">李四</div>
        </div>
        <div class="m-item">
          <div class="avatar invite">+</div>
          <div class="name">邀请</div>
        </div>
      </div>

      <div class="tap-hint">
        <span class="ico">👆</span>
        <span>点击其他成员头像，向他支付积分</span>
      </div>

      <div class="messages">
        <div class="msg system">张三 加入房间</div>
        <div class="msg-row self">
          <div class="avatar sm">法</div>
          <div class="bubble">快点吧，我等到花儿都谢了</div>
        </div>
        <div class="msg-row">
          <div class="avatar sm">张</div>
          <div class="bubble">好嘞，发牌发牌</div>
        </div>
        <div class="msg system pay">
          法外狂徒<span class="arrow">→</span>李四<span class="amount">50 分</span>
        </div>
        <div class="msg-row">
          <div class="avatar sm" style="background:#e8f7ee;color:#34a35b">王</div>
          <div class="bubble">这把稳了 🎉</div>
        </div>
      </div>
    </div>

    <div class="actions-bar">
      <button class="btn primary block">💬 快捷语句</button>
    </div>
  </div>
</div>
</body>
</html>
