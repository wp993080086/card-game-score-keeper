<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>战绩空状态</title>
<link rel="stylesheet" href="common.css">
<style>
  .empty {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 32px 0;
    text-align: center;
  }
  .empty .illus {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: var(--primary-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    margin-bottom: 20px;
  }
  .empty .title {
    font-size: 16px; font-weight: 600;
    color: var(--text-1);
  }
  .empty .desc {
    font-size: 13px; color: var(--text-3);
    line-height: 1.6;
    margin-top: 8px;
  }
  .empty .btn {
    margin-top: 24px;
    min-width: 160px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="icons">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span>📶</span>
        <span class="battery"><i></i></span>
      </div>
    </div>
    <div class="nav-bar">
      <div></div>
      <div class="title">战绩</div>
      <div class="action">⌕</div>
    </div>

    <div class="screen">
      <div class="empty">
        <div class="illus">🃏</div>
        <div class="title">还没有牌局记录</div>
        <div class="desc">创建房间或扫码加入好友的牌局，<br>打完自动生成战绩。</div>
        <button class="btn primary">+ 去开局</button>
      </div>
    </div>

    <div class="tabbar">
      <div class="item">
        <div class="ico">⌂</div>
        <div>首页</div>
      </div>
      <div class="item active">
        <div class="ico">📊</div>
        <div>战绩</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
