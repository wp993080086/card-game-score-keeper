<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>快捷语句面板</title>
<link rel="stylesheet" href="common.css">
<style>
  .dim-bg {
    flex: 1;
    background: var(--bg-2);
    padding: 12px 16px;
    opacity: 0.3; filter: blur(2px);
  }
  .dim-bg .tap-hint {
    margin: 0 0 12px;
    font-size: 11px;
    color: var(--text-3);
    display: flex; align-items: center; gap: 4px;
    min-height: 32px;
  }
  .dim-bg .tap-hint .ico { color: var(--primary); }

  /* 底部抽屉面板 */
  .sheet-mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .sheet {
    background: var(--bg);
    border-radius: 16px 16px 0 0;
    padding: 20px 16px calc(16px + 34px);
    box-shadow: var(--shadow-pop);
  }
  .sheet .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .sheet .head .title { font-size: 16px; font-weight: 600; }
  .sheet .head .close {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--text-3);
    cursor: pointer;
  }
  .phrase-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .phrase-item {
    background: var(--bg-2);
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 14px;
    color: var(--text-1);
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .phrase-item:active { background: var(--primary-soft); color: var(--primary-text); }
  .phrase-item .send {
    font-size: 12px; color: var(--text-4);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="icons">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span>📶</span>
        <span class="battery"><i></i></span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="back">‹</div>
      <div class="title">房间 mucj</div>
      <div class="action">⋯</div>
    </div>

    <div class="screen no-tabbar" style="position:relative">
      <!-- 背景虚化的房间页 -->
      <div class="dim-bg">
        <div class="tap-hint">
          <span class="ico">👆</span>
          <span>点击其他成员头像，向他支付积分</span>
        </div>
      </div>

      <!-- 底部抽屉：快捷语句 -->
      <div class="sheet-mask">
        <div class="sheet">
          <div class="head">
            <div class="title">快捷语句</div>
            <div class="close">✕</div>
          </div>
          <div class="phrase-list">
            <div class="phrase-item"><span>快点吧，我等到花儿都谢了</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>好嘞，发牌发牌</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>这把稳了 🎉</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>大哥手下留情</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>我先去趟洗手间</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>输了输了，愿赌服输</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>别慌，稳住</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>今天手气不错 😎</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>再来一把？</span><span class="send">发送</span></div>
            <div class="phrase-item"><span>散伙散伙，改天再战</span><span class="send">发送</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
