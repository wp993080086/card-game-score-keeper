<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>对局详情</title>
<link rel="stylesheet" href="common.css">
<style>
  .head-info {
    margin: 16px 16px 0;
    padding: 16px;
    background: linear-gradient(135deg, #edf2fc 0%, #f5f8ff 100%);
    border-radius: 16px;
    border: 1px solid #dde7fa;
  }
  .head-info .top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .head-info .code {
    font-family: monospace; font-size: 20px;
    font-weight: 700; letter-spacing: 2px;
    color: var(--text-1);
  }
  .head-info .date {
    font-size: 12px; color: var(--text-3);
  }
  .head-info .my-net {
    text-align: right;
  }
  .head-info .my-net .lbl {
    font-size: 11px; color: var(--text-3);
  }
  .head-info .my-net .val {
    font-size: 22px; font-weight: 700; margin-top: 2px;
    font-feature-settings: 'tnum';
  }
  .head-info .my-net .val.win { color: var(--win); }
  .head-info .my-net .val.lose { color: var(--lose); }

  .head-info .summary-row {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px dashed #c9d6f0;
    font-size: 12px; color: var(--text-2);
  }
  .head-info .summary-row .dot {
    color: var(--text-4);
  }
  .head-info .summary-row .badge {
    margin-left: auto;
    background: var(--win-soft);
    color: var(--win-text);
    font-size: 11px; font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .section-title {
    font-size: 14px; font-weight: 600;
    margin: 20px 16px 10px;
  }

  /* 累计输赢：去掉进度条，昵称完整单行展示 */
  .stats-card {
    margin: 0 16px 16px;
    background: var(--bg);
    border-radius: 12px;
    padding: 4px 0;
    box-shadow: var(--shadow-card);
  }
  .stat-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--divider);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .avatar { width: 32px; height: 32px; font-size: 13px; }
  .stat-row .name {
    font-size: 14px; flex: 1; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat-row .val {
    min-width: 60px; text-align: right;
    font-size: 15px; font-weight: 700;
    font-feature-settings: 'tnum';
  }
  .stat-row .val.win { color: var(--win); }
  .stat-row .val.lose { color: var(--lose); }

  /* 结算方案：第二顺序 */
  .plans-card {
    margin: 0 16px 16px;
    background: var(--bg);
    border-radius: 12px;
    padding: 4px 0;
    box-shadow: var(--shadow-card);
  }
  .plans-card .plan-item {
    display: flex; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--divider);
    font-size: 14px;
    gap: 8px;
  }
  .plans-card .plan-item:last-child { border-bottom: none; }
  .plans-card .avatar { width: 28px; height: 28px; font-size: 12px; flex-shrink: 0; }
  .plans-card .from, .plans-card .to {
    font-weight: 500; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .plans-card .to { text-align: right; }
  .plans-card .arrow { color: var(--text-4); }
  .plans-card .amount {
    font-weight: 600; color: var(--lose-text);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="phone-frame">
    <div class="status-bar">
      <span>9:41</span>
      <div class="icons">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span>📶</span>
        <span class="battery"><i></i></span>
      </div>
    </div>
    <div class="nav-bar">
      <div class="back">‹</div>
      <div class="title">对局详情</div>
      <div class="action">⋯</div>
    </div>

    <div class="screen no-tabbar">
      <div class="scroll">
        <div class="head-info">
          <div class="top">
            <div>
              <div class="code">mucj</div>
              <div class="date" style="margin-top:4px">2026-09-28 · 14:20</div>
            </div>
            <div class="my-net">
              <div class="lbl">你的净输赢</div>
              <div class="val lose">-80 分</div>
            </div>
          </div>
          <div class="summary-row">
            <span>4 人参与</span>
            <span class="dot">·</span>
            <span>共 5 笔转账</span>
            <span class="badge">已结算</span>
          </div>
        </div>

        <!-- 第二顺序：结算方案 -->
        <div class="section-title">结算方案</div>
        <div class="plans-card">
          <div class="plan-item">
            <div class="avatar lose-bg">李</div>
            <div class="from">李四</div>
            <div class="arrow">→</div>
            <div class="to">张三</div>
            <div class="amount">200 分</div>
          </div>
          <div class="plan-item">
            <div class="avatar" style="background:#e8f7ee;color:#34a35b">王</div>
            <div class="from">王五</div>
            <div class="arrow">→</div>
            <div class="to">张三</div>
            <div class="amount">50 分</div>
          </div>
        </div>

        <!-- 第三顺序：累计输赢 -->
        <div class="section-title">每人累计输赢</div>
        <div class="stats-card">
          <div class="stat-row">
            <div class="avatar">法</div>
            <div class="name">法外狂徒</div>
            <div class="val lose">-60</div>
          </div>
          <div class="stat-row">
            <div class="avatar win-bg">张</div>
            <div class="name">张三</div>
            <div class="val win">+200</div>
          </div>
          <div class="stat-row">
            <div class="avatar lose-bg">李</div>
            <div class="name">李四</div>
            <div class="val lose">-50</div>
          </div>
          <div class="stat-row">
            <div class="avatar" style="background:#e8f7ee;color:#34a35b">王</div>
            <div class="name">王五</div>
            <div class="val lose">-90</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
